name: Test dependency check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify docker and jq are available
        run: |
          echo "Checking for docker..."
          if ! which docker > /dev/null 2>&1; then
            echo "FAIL: docker is not available on this runner"
            exit 1
          fi
          echo "docker found: $(docker --version)"

          echo "Checking for jq..."
          if ! which jq > /dev/null 2>&1; then
            echo "FAIL: jq is not available on this runner"
            exit 1
          fi
          echo "jq found: $(jq --version)"

          echo "PASS: all required dependencies are available"

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          user: github
          dryrun: "yes"
          use_mocked_data: "yes"
          use_prebuilt_image: "yes"
          output_action: "none"
          config_output: "svg"
          base: "header"
        continue-on-error: true

      - name: Assert action was executed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was executed (outcome=$OUTCOME)"
