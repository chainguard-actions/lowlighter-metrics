name: Test dryrun with mocked data
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          user: github
          dryrun: "yes"
          use_mocked_data: "yes"
          use_prebuilt_image: "yes"
          output_action: "none"
          config_output: "svg"
          base: "header"
          debug: "yes"
          debug_print: "yes"
        continue-on-error: true

      - name: Assert action ran without fatal error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may succeed or fail depending on image availability,
          # but it should not be skipped — it must have been attempted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was executed (outcome=$OUTCOME)"
